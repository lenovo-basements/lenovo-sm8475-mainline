%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/novatek,nt36523n-ts.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36523N SPI touchscreen controller

maintainers:
  - lolipuru <banstellazz@gmail.com>

description:
  The touch controller of the Novatek NT36523N touch and display driver IC
  (TDDI). Touch and display share the chip, so the touch side has no reset or
  supplies of its own; it is powered and reset together with the display
  panel it follows.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: novatek,nt36523n-ts

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  panel:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The display panel driven by the same NT36523N. The touchscreen is
      brought up after the panel is powered on.

  firmware-name:
    maxItems: 1

  novatek,pen-support:
    type: boolean
    description: The panel has an active pen digitiser.

required:
  - compatible
  - reg
  - interrupts
  - panel

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "novatek,nt36523n-ts";
            reg = <0>;
            spi-max-frequency = <9600000>;
            interrupts-extended = <&tlmm 21 IRQ_TYPE_EDGE_RISING>;
            panel = <&display_panel>;
            firmware-name = "novatek/novatek_ts_fw.bin";
            touchscreen-size-x = <1600>;
            touchscreen-size-y = <2560>;
            novatek,pen-support;
        };
    };
...
