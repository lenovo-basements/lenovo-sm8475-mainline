%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/willsemi,wl2864c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Will Semiconductor WL2864C camera PMIC

maintainers:
  - lolipuru <banstellazz@gmail.com>

description:
  The WL2864C is an I2C controlled power management IC with seven LDOs,
  typically used to supply camera sensors and lens actuators. LDO1 and LDO2
  are low voltage outputs fed from vin1, LDO3 to LDO7 are fed from vin2.

properties:
  compatible:
    const: willsemi,wl2864c

  reg:
    maxItems: 1

  vddio-supply:
    description: Supply of the I2C interface and control logic.

  vin1-supply:
    description: Input supply of LDO1 and LDO2.

  vin2-supply:
    description: Input supply of LDO3 to LDO7.

  regulators:
    type: object
    additionalProperties: false

    patternProperties:
      "^ldo[1-7]$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg
  - vddio-supply
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@29 {
            compatible = "willsemi,wl2864c";
            reg = <0x29>;
            vddio-supply = <&vreg_io>;
            vin1-supply = <&vreg_1p8>;
            vin2-supply = <&vreg_bob>;

            regulators {
                ldo1 {
                    regulator-name = "cam_dvdd";
                    regulator-min-microvolt = <1100000>;
                    regulator-max-microvolt = <1100000>;
                };

                ldo4 {
                    regulator-name = "cam_avdd";
                    regulator-min-microvolt = <2800000>;
                    regulator-max-microvolt = <2800000>;
                };
            };
        };
    };
